name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android kaldırıldı: sdkmanager'ın kurmaya çalıştığı eski
      # "tools" paketi Google'ın SDK deposundan silindi (sdkmanager exit 1 ile patlıyordu).
      # ubuntu-latest runner image'ı zaten çalışan bir Android SDK ile geliyor — publish.yml
      # bu adım hiç olmadan Android derlemesini sorunsuz yapıyor, ayrıca gerek yok.
      - name: gradlew çalıştırılabilir
        run: chmod +x ./gradlew

      - name: grid + demo derle (Desktop + Android)
        run: ./gradlew :grid:compileKotlinDesktop :grid:compileDebugKotlinAndroid :demo:compileKotlinDesktop
