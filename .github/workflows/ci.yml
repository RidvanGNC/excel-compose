name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: gradlew çalıştırılabilir
        run: chmod +x ./gradlew

      - name: grid + demo derle (Desktop + Android)
        run: ./gradlew :grid:compileKotlinDesktop :grid:compileDebugKotlinAndroid :demo:compileKotlinDesktop
