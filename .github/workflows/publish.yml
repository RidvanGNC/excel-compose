name: publish

# Pushing a version tag (v0.1.0, v0.2.0, ...) publishes :grid to Maven Central and creates a
# matching GitHub Release with auto-generated notes. Needs four repo secrets set up per
# PUBLISHING.md: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY (armored private
# key), SIGNING_PASSWORD.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: gradlew çalıştırılabilir
        run: chmod +x ./gradlew

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :grid:publishAndReleaseToMavenCentral --no-configuration-cache

      # Maven Central'a yayın YALNIZ artifact'i yayınlar — GitHub'ın kendi Releases
      # sayfasına ayrıca dokunmaz. Tag push edilince bu adım olmadan Releases sekmesi
      # hep boş kalıyordu.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
